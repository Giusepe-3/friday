claude_model: claude-sonnet-4-6
shim_model: haiku                       # voice shim default — fast replies; Sonnet still used for text mode
wake_model: hey_jarvis
wake_threshold: 0.5
# voice_reference: voices/kerry.wav   # uncomment once you drop a Kerry clip
voice_speaker: Claribel Dervla          # XTTS v2 built-in, Irish-lilt female
voice_language: en
sample_rate: 16000
playback_gain: 1.4    # multiplier applied to all WAV playback; clipped to int16 range
silence_timeout_s: 60
max_recording_s: 15
research:
  paper_fetch_allowlist:
    - arxiv.org
    - openreview.net
    - aclanthology.org
    - semanticscholar.org
    - neurips.cc
    - proceedings.mlr.press
  paper_fetch_max_bytes: 5242880
  paper_fetch_timeout_s: 30
  schedules:
    daily_standup: "09:00"
    check_predictions: "09:05"
    weekly_research_review: "SUN 18:00"
  catchup_window_h: 12

close_phrases:
  - "that's all friday"
  - "thats all friday"
  - "thanks friday"
  - "thank you friday"
  - "fine friday"
  - "goodbye friday"
  - "bye friday"
  - "we're done friday"
  - "were done friday"
