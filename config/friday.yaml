claude_model: claude-opus-4-7
shim_model: claude-opus-4-7             # voice shim model — Opus 4.7 everywhere
friday_effort: max
wake_model: hey_jarvis
wake_threshold: 0.5
# voice_reference: voices/kerry.wav   # uncomment once you drop a Kerry clip
voice_speaker: Claribel Dervla          # XTTS v2 built-in, Irish-lilt female
voice_language: en
sample_rate: 16000
playback_gain: 1.4    # multiplier applied to all WAV playback; clipped to int16 range
playback_speed: 1.5   # time-stretch factor (1.0 = natural, 1.5 = 50% faster, pitch preserved)
silence_timeout_s: 90        # 1.5 min of no speech → silent re-arm to wake-word
max_recording_s: 15
research:
  paper_fetch_allowlist:
    - arxiv.org
    - openreview.net
    - aclanthology.org
    - semanticscholar.org
    - neurips.cc
    - proceedings.mlr.press
  paper_fetch_max_bytes: 5242880
  paper_fetch_timeout_s: 30
  schedules:
    daily_standup: "09:00"
    check_predictions: "09:05"
    weekly_research_review: "SUN 18:00"
  catchup_window_h: 12

close_phrases:
  - "terminate jarvis"

workers:
  paper:
    repo: C:/Users/leona/Documents/GitHub/Learning/Verification_Paper
    aliases: [paper, draft, verification, azr, "the paper"]
    default_model: claude-opus-4-7
    default_effort: high
    autostart: true
    pulse_interval_working_s: 30
    pulse_interval_idle_s: 300
    checkpoint_triggers:
      bash_regex:
        - '^git commit'
        - '^git push'
        - 'runpod'
        - 'bash setup_.*pod'
        - 'wandb init'
  thesis:
    repo: C:/Users/leona/Documents/GitHub/Learning/dgm_bachelor_thesis
    aliases: [thesis, experiment, dgm, "darwin godel", "coding agent", polyglot]
    default_model: claude-opus-4-7
    default_effort: high
    autostart: true
    pulse_interval_working_s: 30
    pulse_interval_idle_s: 300
    checkpoint_triggers:
      bash_regex:
        - '^git commit'
        - '^git push'
        - 'docker run'
  research:
    repo: C:/Users/leona/Documents/GitHub/Learning/AI-Research-Project
    aliases: [research, literature, "lit review", progress, "the notes"]
    default_model: claude-opus-4-7
    default_effort: high
    autostart: true
    pulse_interval_working_s: 30
    pulse_interval_idle_s: 300
    checkpoint_triggers:
      bash_regex:
        - '^git commit'
        - '^git push'
